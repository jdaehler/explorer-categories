name: Attest release assets

# Proves that the released main.js, manifest.json and styles.css are the
# files that sit in this repository at the release tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to attest
        required: true

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  attest:
    # Pinned rather than ubuntu-latest, which moves to 26.04 between
    # 2026-10-19 and 2026-11-19 (actions/runner-images#14748). Pinned,
    # the switch happens here, on purpose, and is tested once.
    runs-on: ubuntu-26.04
    steps:
      # v7 runs on Node.js 24; v4 ran on Node.js 20, which GitHub has
      # deprecated.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
